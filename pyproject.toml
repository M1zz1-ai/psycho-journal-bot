[project]
name = "psycho-journal-bot"
version = "0.1.0"
description = "Telegram voice-journaling bot with an AI cold-stoic therapist: Whisper STT, redis journal, on-demand and weekly analysis (OpenAI)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "M1zz1-ai" }]
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.0",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "redis>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "psycho"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# pyflakes (F), import sorting (I), pyupgrade (UP), bugbear (B), and the
# error-level pycodestyle subsets — line length is left to judgment, not the linter.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
