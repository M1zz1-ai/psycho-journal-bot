<svg viewBox="-16.0 -16.0 652.0 232.0" width="652.0" height="232.0" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bot logic and tools depend on a three-method interface — run, structured_output, tool — and only one adapter module below it knows which vendor SDK is in use"><rect x="-16.0" y="-16.0" width="652.0" height="232.0" fill="#0E0A14"/>
        <g font-family="ui-monospace,monospace" font-size="9" fill="#EDE6DA">
          <g stroke="#EDE6DA" stroke-width="1" fill="#171122">
            <rect x="0" y="16" width="190" height="30"/><rect x="215" y="16" width="190" height="30"/>
            <rect x="430" y="16" width="190" height="30"/>
          </g>
          <text x="10" y="36">router</text><text x="225" y="36">analysis + tools</text>
          <text x="440" y="36">weekly report</text>

          <rect x="0" y="80" width="620" height="34" fill="#171122"
            stroke="#B57BFF" stroke-width="2"/>
          <text x="12" y="101" fill="#B57BFF">.run()   .structured_output()   .tool()</text>
          <text x="430" y="101" fill="#B57BFF" opacity=".75">the whole contract</text>

          <rect x="0" y="140" width="298" height="30" fill="#171122"
            stroke="#EDE6DA" stroke-width="1"/>
          <text x="10" y="160">core/openai_agent.py</text>
          <rect x="322" y="140" width="298" height="30" fill="none"
            stroke="#3A2E52" stroke-width="1" stroke-dasharray="3 4"/>
          <text x="332" y="160" opacity=".5">the Anthropic one, retired</text>
          <text x="0" y="192" opacity=".6">ONE MODULE KNOWS WHICH VENDOR &mdash; EVERYTHING ABOVE NEVER FINDS OUT</text>
        </g>
        <g stroke="#EDE6DA" stroke-width="1" fill="none" opacity=".45">
          <path d="M95 46 L95 80"/><path d="M310 46 L310 80"/><path d="M525 46 L525 80"/>
          <path d="M150 114 L150 140"/>
        </g>
      </svg>